name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Static gates
        run: node scripts/check.mjs
      - name: i18n keys
        run: node scripts/i18n-check.mjs
      - name: Tests（分层 test/{unit,contract,hook,data,worker,lifecycle,sync,client}）
        run: npm test
